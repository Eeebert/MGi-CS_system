<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morris Gilbert Inso - Runner Dashboard</title>
    <meta name="theme-color" content="#0f141a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="images/loading_logo.png" />
    <link rel="apple-touch-icon" href="images/loading_logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-a" aria-hidden="true"></div>
    <div class="bg-shape shape-b" aria-hidden="true"></div>

    <header class="brand-card topbar">
      <img src="images/mgi_logo.png" alt="Morris Gilbert Inso logo" class="logo" />
      <div>
        <h1>Morris Gilbert Inso</h1>
        <p>Credit Services</p>
        <p>0965-338-2418</p>
        <p>Talisay, Santander, Cebu</p>
      </div>
      <div class="topbar-actions">
        <button id="runner-back-dashboard" class="btn-secondary" type="button">Dashboard</button>
        <button id="runner-logout" class="btn-danger" type="button">Log Out</button>
        <button id="runner-hamburger" class="btn-hamburger" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="portfolio-page" id="runner-main">
      <section class="panel portfolio-hero">
        <h2>Account Officer</h2>
        <div style="display: flex; flex-direction: row; gap: 8px; flex-wrap: wrap;">
          <a href="officer-dashboard.html?officer=JunJun" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">JunJun</button></a>
          <a href="officer-dashboard.html?officer=Aga" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">Aga</button></a>
          <a href="officer-dashboard.html?officer=Jomar" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">Jomar</button></a>
          <a href="officer-dashboard.html?officer=James" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">James</button></a>
          <a href="officer-dashboard.html?officer=Jambi" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">Jambi</button></a>
          <a href="officer-dashboard.html?officer=Maria%20Joy" style="text-decoration: none;"><button class="btn-primary" type="button" style="padding: 12px 24px; font-size: 1.1rem;">Maria Joy</button></a>
        </div>
      </section>
    </main>

    <div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>
    <aside id="side-drawer" class="side-drawer" aria-hidden="true">
      <div class="side-drawer-header">
        <button id="drawer-close" class="drawer-close" type="button" aria-label="Close menu">&#10005;</button>
      </div>
      <div class="side-drawer-theme">
        <span class="side-drawer-theme-label">Theme</span>
        <div class="side-drawer-theme-options" role="radiogroup" aria-label="Theme selection">
          <label class="theme-option"><input type="radio" name="theme-choice" value="white" /> <span>White</span></label>
          <label class="theme-option"><input type="radio" name="theme-choice" value="black" /> <span>Black</span></label>
        </div>
      </div>
      <div class="side-drawer-footer">
        <button id="drawer-logout" class="btn-danger" type="button" style="width:100%;">Log Out</button>
      </div>
    </aside>

    <script src="pwa-init.js"></script>
    <script src="runner.js"></script>
  </body>
</html>
