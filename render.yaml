services:
  - type: web
    name: mgi-cs-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mgi-cs-postgres
          property: connectionString

databases:
  - name: mgi-cs-postgres
    plan: free
    databaseName: mgi_cs_system
    user: mgi_user
